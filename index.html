<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Manage Your Money</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for the Pie Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container { padding-top: 40px; padding-bottom: 60px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-radius: 15px 15px 0 0 !important; padding: 15px 20px;
        }
        .form-control, .form-select { border-radius: 8px; padding: 10px; border: 1px solid #ddd; }
        .form-control:focus, .form-select:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25); }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 8px; padding: 10px 25px; font-weight: 600;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-danger { border-radius: 5px; }
        .summary-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); height: 100%; }
        .summary-card h3 { color: #667eea; font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
        .summary-card p { color: #666; margin: 0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .icon-box { font-size: 2rem; }
        .chart-container { position: relative; height: 250px; width: 100%; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="container main-container">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="text-white display-5 fw-bold"><i class="fas fa-wallet me-2"></i>Expense Tracker</h1>
            <p class="text-white-50">Track, save, and visualize your spending</p>
        </div>

        <!-- Summary Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="summary-card text-center">
                    <div class="icon-box text-success"><i class="fas fa-rupee-sign"></i></div>
                    <h3 id="totalExpenses">₹0.00</h3>
                    <p>Total Spent</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card text-center">
                    <div class="icon-box text-primary"><i class="fas fa-receipt"></i></div>
                    <h3 id="totalItems">0</h3>
                    <p>Total Transactions</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card text-center">
                    <div class="icon-box text-warning"><i class="fas fa-chart-pie"></i></div>
                    <h3 id="topCategory">-</h3>
                    <p>Top Category</p>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column: Form & Table -->
            <div class="col-lg-8">
                <!-- Add Expense Form -->
                <div class="card mb-4">
                    <div class="card-header"><h5 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Add New Expense</h5></div>
                    <div class="card-body">
                        <form id="expenseForm">
                            <div class="row g-2">
                                <div class="col-md-3">
                                    <input type="date" class="form-control" id="date" required>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" id="category" required>
                                        <option value="">Category</option>
                                        <option value="Food"> Food</option>
                                        <option value="Transport">🚗 Transport</option>
                                        <option value="Shopping">🛍️ Shopping</option>
                                        <option value="Entertainment"> Entertainment</option>
                                        <option value="Bills">💡 Bills</option>
                                        <option value="Health">🏥 Health</option>
                                        <option value="Other">📦 Other</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <input type="text" class="form-control" id="description" placeholder="Description" required>
                                </div>
                                <div class="col-md-2">
                                    <input type="number" class="form-control" id="amount" placeholder="₹0.00" step="0.01" required>
                                </div>
                            </div>
                            <div class="text-end mt-3">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-plus me-1"></i> Add Expense</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Expenses Table -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-list-alt me-2"></i>History</h5>
                        <button class="btn btn-sm btn-outline-light" onclick="clearAllExpenses()" id="clearBtn" style="display:none;">
                            <i class="fas fa-trash-alt me-1"></i> Clear All
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Date</th>
                                        <th>Category</th>
                                        <th>Description</th>
                                        <th class="text-end">Amount</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="expenseTableBody"></tbody>
                            </table>
                        </div>
                        <div id="noExpenses" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-3x mb-3 text-secondary"></i>
                            <p>No expenses yet. Add one above!</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Chart -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header"><h5 class="mb-0"><i class="fas fa-chart-pie me-2"></i>Spending by Category</h5></div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="expenseChart"></canvas>
                        </div>
                        <div id="noChartData" class="text-center text-muted py-4 mt-3">
                            <small>Add expenses to see the chart</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // --- 1. STATE MANAGEMENT & LOCAL STORAGE ---
        let expenses = JSON.parse(localStorage.getItem('myExpenses')) || [];
        let myChart = null;

        // Set today's date as default
        document.getElementById('date').valueAsDate = new Date();

        // --- 2. CORE FUNCTIONS ---
        function saveData() {
            localStorage.setItem('myExpenses', JSON.stringify(expenses));
        }

        function renderApp() {
            const tbody = document.getElementById('expenseTableBody');
            const noExpensesMsg = document.getElementById('noExpenses');
            const clearBtn = document.getElementById('clearBtn');
            const noChartData = document.getElementById('noChartData');

            tbody.innerHTML = '';
            
            if (expenses.length === 0) {
                noExpensesMsg.style.display = 'block';
                clearBtn.style.display = 'none';
                noChartData.style.display = 'block';
            } else {
                noExpensesMsg.style.display = 'none';
                clearBtn.style.display = 'inline-block';
                noChartData.style.display = 'none';

                // Sort by date (newest first)
                const sortedExpenses = [...expenses].sort((a, b) => new Date(b.date) - new Date(a.date));

                sortedExpenses.forEach((exp, index) => {
                    // Find original index for deletion
                    const originalIndex = expenses.indexOf(exp);
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${formatDate(exp.date)}</td>
                        <td><span class="badge bg-primary bg-opacity-75">${exp.category}</span></td>
                        <td>${exp.description}</td>
                        <td class="text-end text-success fw-bold">₹${parseFloat(exp.amount).toFixed(2)}</td>
                        <td class="text-center">
                            <button class="btn btn-danger btn-sm" onclick="deleteExpense(${originalIndex})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            updateSummary();
            updateChart();
        }

        function addExpense(e) {
            e.preventDefault();
            const newExpense = {
                date: document.getElementById('date').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                amount: document.getElementById('amount').value
            };

            expenses.push(newExpense);
            saveData();
            renderApp();

            // Reset form (keep date)
            document.getElementById('category').value = '';
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
        }

        function deleteExpense(index) {
            if(confirm('Delete this expense?')) {
                expenses.splice(index, 1);
                saveData();
                renderApp();
            }
        }

        function clearAllExpenses() {
            if(confirm('Are you sure you want to delete ALL expenses? This cannot be undone.')) {
                expenses = [];
                saveData();
                renderApp();
            }
        }

        // --- 3. UI UPDATES ---
        function updateSummary() {
            const total = expenses.reduce((sum, exp) => sum + parseFloat(exp.amount), 0);
            document.getElementById('totalExpenses').textContent = '₹' + total.toFixed(2);
            document.getElementById('totalItems').textContent = expenses.length;

            // Find top category
            const categories = {};
            expenses.forEach(exp => { categories[exp.category] = (categories[exp.category] || 0) + parseFloat(exp.amount); });
            const topCat = Object.keys(categories).reduce((a, b) => categories[a] > categories[b] ? a : b, '-');
            document.getElementById('topCategory').textContent = expenses.length > 0 ? topCat : '-';
        }

        function updateChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const categories = {};
            
            expenses.forEach(exp => {
                categories[exp.category] = (categories[exp.category] || 0) + parseFloat(exp.amount);
            });

            const labels = Object.keys(categories);
            const data = Object.values(categories);

            if (myChart) myChart.destroy();

            if (labels.length > 0) {
                myChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff', '#ff9f40', '#c9cbcf'],
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10 } }
                        }
                    }
                });
            }
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        // --- 4. EVENT LISTENERS ---
        document.getElementById('expenseForm').addEventListener('submit', addExpense);

        // Initial Render
        renderApp();
    </script>
</body>
</html>
